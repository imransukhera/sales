<div class="w-full relative h-full" [ngClass]="{'dull-bg': loading}">
    <app-dashboard>
        <button type="button" (click)="showdialog()"
        class="focus:outline-none w-full md:w-auto text-white bg-[#1c4c74] hover:bg-[#1c4c74] focus:ring-4 focus:bg-[#1c4c74] rounded-lg text-sm px-3 me-2 dark:bg-[#1c4c74] dark:hover:bg-[#1c4c74] dark:focus:bg-[#1c4c74] h-[35px]">
        Leaves Request</button>
    </app-dashboard>
    <div class="my-4 mb-8">
        <span class="text-3xl font-semibold text-gray-700">Leave Application</span>
    </div>
    <div class="flex md:flex-row flex-col gap-4 mt-8">

    <div class="grid grid-cols-1  gap-3 md:w-[25%]  ">
        <div class="flex flex-col gap-2 justify-center items-center border-t-8 border-lime-400 shadow-lg h-[200px]"> 
            <span class="text-2xl text-gray-700 font-semibold">Total Leaves</span>
            <div class="text-3xl font-semibold"> <span class="text-red-500">{{totalleave}}</span><span class="text-green-500">/{{userdata.leaves}}</span></div>
            <div class="text-xl font-semibold"> <span>Remaining: </span><span class="text-green-500">{{userdata.leaves - totalleave }}</span></div>
        </div>
        <div class="flex flex-col gap-2 justify-center items-center border-t-8 border-blue-950 shadow-lg h-[200px]"> 
            <span class="text-2xl text-gray-700 font-semibold">Apply Leaves Request </span>
            <span class="text-3xl font-semibold" [ngClass]="{'text-green-600': leavedata[0].status === 'Approved', 'text-yellow-500': leavedata[0].status === 'Pending...'}">{{leavedata[0].status}}</span>
        </div>
    </div>

    <div class="data-table border-4 border-[#1c4c74] rounded-lg p-1 md:w-[75%]">

    <p-table [value]="[leavedata]" scrollHeight="flex" class="p-datatable-gridlines p-datatable-striped ">
        <ng-template pTemplate="header">
            <tr class="p-2 bg-[#349ce4]">
                <th class="bg-[#1c4c74] p-3 text-white w-[250px]">
                    <span class="font-semibold text-md">Name</span>
                </th>
                <th class="bg-[#1c4c74] p-3 text-white w-[250px]">
                    <span class="font-semibold text-md">Leave Type</span>
                </th>
                <th class="bg-[#1c4c74] p-3 text-white w-[250px]">
                    <span class="font-semibold text-md">Date</span>
                </th>
                <th class="bg-[#1c4c74] p-3 text-white w-[250px]">
                    <span class="font-semibold text-md">Status</span>
                </th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body">
            <tr *ngFor="let item of leavedata">
                <td class="p-3">
                    <div class="font-semibold min-w-16	">
                        {{item.name}}
                    </div>
                </td>
                <td class="p-3">
                    <div class="font-semibold min-w-16	">
                        {{item.leavetype}}
                    </div>
                </td>
                <td class="p-3">
                    <div class="font-semibold min-w-32	">
                        {{item.date}}
                    </div>
                </td>
                <td class="p-3">
                    <div class="font-semibold w-fit	" [ngClass]="{'text-green-600': item.status === 'Approved', 'text-yellow-500': item.status === 'Pending...'}" >
                        {{item.status}}
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>

    </div>
</div>
</div>

<p-dialog [modal]="true" [(visible)]="visible" [style]="{ width: '25rem' }" >
    <span class="text-lg font-semibold block pb-3 border-b-2 p-2">Leave Request</span>
    <form [formGroup]="leaveForm">
    <div class="flex flex-col items-center justify-center p-3 gap-3">
        <div class="align-items-center mt-3 w-full">
            <label class="text-sm ">Date <span class="text-red-500">*</span></label>
            <div class="mt-1 border-[0.5px] rounded-md mb-1 w-full">
                <p-calendar [ngModel]="date" formControlName="date" appendTo="body" [readonlyInput]="true" inputId="range" class="w-full">
                </p-calendar>
            </div>
            <!-- <div *ngIf="submitted && f['date'].errors" class="invalid-feedback">
                <div *ngIf="!f['date'].value" class="error text-sm text-red-500">
                    Field is required
                </div>
            </div> -->
        </div>
    <div class="w-full  ">
        <label class="text-sm ">Project <span class="text-red-500">*</span></label>
        <div class="mt-1 ">
            <p-dropdown [options]="leaveduration"  formControlName="leavetype" optionValue="name" optionLabel="name"
                placeholder="Select a leave duration"  />
        </div>
    </div>
    <div class="align-items-center w-full ">
        <label class="text-sm ">Description <span class="text-red-500">*</span></label>
        <div class="mt-1">
            <textarea id="message" rows="4"  formControlName="description"
                class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                placeholder="Write your thoughts here..." ></textarea>
        </div>
    </div>

    
    </div>
    <div class="mt-3 justify-end flex  mb-4">
        <button type="button"  (click)="visible= false"
            class="focus:outline-none border-1 bg-white rounded-lg text-sm px-3 me-2  h-[35px]">
            Cancel </button>
        <button type="button" 
            class="focus:outline-none text-white bg-[#1c4c74] rounded-lg text-sm px-3 me-2 dark:bg-green-600 h-[35px]" (click)="leavesubmit()">
            Submit leave request
        </button>   
    </div>
</form>
    
</p-dialog>
