<nav [ngClass]="{'w-60': sidebarOpen, 'w-15': !sidebarOpen, 'transition-all': true, 'duration-300': true, 'flex md:hidden': open , 'hidden md:flex':!open}"

    <!-- Header -->
    <header class="flex items-center justify-center p-2 pt-4 border-b border-gray-700 overflow-hidden">
      
        <!-- (click)="toggleSidebar()" -->
        <button class="text-gray-400 focus:outline-none" >
        <img src="../../../../assets/figma.png" alt="" class="w-[35px] h-[30px] " *ngIf="!sidebarOpen">
        <img src="../../../../assets/logo.png" alt="" class="w-[190px] " *ngIf="sidebarOpen">
        </button>

    </header>

    <!-- Menu -->
    <div class="menu-bar flex-1 overflow-y-auto overflow-x-hidden" >
        <div class="menu">
            <ul class="menu-links">
                <!-- Dashboard -->

                                </svg>

                                </span>
                            </div>

                </li>

                                <svg class="h-7 w-8 text-white"  fill="white" viewBox="-10 0 489 489"  >
                                    <path stroke-linecap="round" stroke-linejoin="round" fill="wite" stroke-width="0"

    <!-- Logout Button -->
    <footer class="border-t border-gray-700">
        <button routerLink="/privacy-policy"
        class="flex items-center justify-between w-full  mb-1     focus:outline-none">
        <div class="flex items-center gap-3 m-auto" >
           <i class="pi pi-shield text-2xl p-3 rounded-md  bg-white hover:bg-gray-700 text-blue-900 hover:text-white"></i>
            <span class="flex justify-start" *ngIf="sidebarOpen" >Logout</span>
        </div>

        <button routerLink="/{{routeService.login}}" (click)="logout()"
