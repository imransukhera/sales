<div class="w-full relative h-full" [ngClass]="{'dull-bg': loading}">
    <app-dashboard></app-dashboard>
    <div class="my-4 mb-8">
        <span class="text-3xl font-semibold text-gray-700">Task Management</span>
    </div>
    <div class="flex gap-2 w-full my-4 h-[80vh]">
        <div class="flex flex-col gap-1 border-r-2 border-gray-500 w-[20%] text-md font-medium   text-md pr-1 mr-2">
            <a routerLink="/task-management/projects" class="hover:bg-[#3558BE] hover:text-white p-2 rounded-lg pointer"
                routerLinkActive="bg-[#3558BE] text-white" [routerLinkActiveOptions]="{ exact: true }"><i
                    class="pi pi-folder-open mr-1"> </i><span>Projects</span></a>
            <a routerLink="/task-management/task" class="hover:bg-[#3558BE] hover:text-white p-2 rounded-lg pointer"
                routerLinkActive="bg-[#3558BE] text-white" [routerLinkActiveOptions]="{ exact: true }"><i
                    class="pi pi-list-check mr-1"></i><span>Assigning Tasks</span></a>
            <a routerLink="/task-management/issue-report"
                class="hover:bg-[#3558BE] hover:text-white p-2  rounded-lg pointer"
                routerLinkActive="bg-[#3558BE] text-white" [routerLinkActiveOptions]="{ exact: true }"> <i
                    class="pi pi-stop-circle mr-1"></i> <span>Issues Reports</span></a>
        </div>
        <div class="bg-white w-[80%] p-4 rounded-lg shadow-lg overflow-auto">
            <router-outlet></router-outlet>
        </div>

    </div>
</div>
