<div class="w-full relative h-full" [ngClass]="{'dull-bg': loading}">
    <div class="my-4 px-2">
    <span class="text-xl font-semibold text-gray-700">Projects detail</span>
    </div>
    <div class="grid grid-cols-3 gap-4 p-2  h-[68vh] overflow-scroll  rounded-lg ">
        <div *ngFor="let item of project">
        <div class="flex   gap-2  border-t-8 border-lime-400 shadow-lg h-[200px]">
            <div class="bg-[#1c4c74] w-[20%] h-full flex  justify-end ">
            <div class=" mt-4 -mr-5">
                    <img class="w-10 h-10 p-1 rounded-full ring-2 ring-gray-300 dark:ring-gray-500"
                    style="width: 40px !important;"
                    src="https://st4.depositphotos.com/15648834/23779/v/380/depositphotos_237795814-stock-illustration-unknown-person-silhouette-glasses-profile.jpg"
                    alt="Bordered avatar">
                </div>
            </div>
            <div class="flex flex-col justify-between gap-3 pl-5 pr-2  my-4">
                <span class="text-2xl font-semibold ">{{item.name}}</span>
                <div class="flex flex-col gap-1 font-semibold py-2">
                    <span>Total Task Assign : <span class="text-red-500">12</span> </span>
                    <span>Total Issue Assign: <span class="text-green-500">3</span> </span>
                </div>
            </div>
        </div>
    </div>
    </div>
</div>
