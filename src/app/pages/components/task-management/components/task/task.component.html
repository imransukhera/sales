<div class="w-full relative h-full" [ngClass]="{'dull-bg': loading}">
    <div class="flex justify-between items-center p-2 border-b-2 border-gray-300">

        <button type="button"
            class="focus:outline-none w-full md:w-auto text-white bg-[#1c4c74] hover:bg-[#1c4c74] focus:ring-4 focus:bg-[#1c4c74] rounded-sm text-sm px-3 me-2 dark:bg-[#1c4c74] dark:hover:bg-[#1c4c74] dark:focus:bg-[#1c4c74] h-[35px]">Task
            Assign
        </button>
        <div class="flex gap-2 font-semibold">
            <span>Total Task Assign : <span class="text-red-500">12</span> </span>
            <span>Total Task Complete: <span class="text-green-500">3</span> </span>
        </div>
    </div>
    <div class="data-table  rounded-lg p-2">
        <p-table [value]="[item]" [scrollable]="true" scrollHeight="65vh" [virtualScroll]="true"
            class="p-datatable-gridlines p-datatable-striped ">
            <ng-template pTemplate="header">
                <tr class="p-2 bg-[#349ce4]">
                    <th class="bg-[#1c4c74] p-3 text-white w-[250px] border-2 border-white">
                        <span class="font-semibold text-md">Project</span>
                    </th>
                    <th class="bg-[#1c4c74] p-2 text-white border-2 border-white">
                        <span class="font-semibold text-md">Task</span>
                    </th>
                    <th class="bg-[#1c4c74] p-2 text-white border-2 border-white">
                        <span class="font-semibold text-md">Date</span>
                    </th>
                    <th class="bg-[#1c4c74] p-2 text-white border-2 border-white">
                        <span class="font-semibold text-md">Status</span>
                    </th>
                    <th class="bg-[#1c4c74] p-2 pl-5 text-white border-2 border-white">
                        <span class="font-semibold text-md">Action</span>
                    </th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body">
                <tr *ngFor="let item of item, let i=index" class="border-2 border-gray-300 text-sm">
                    <td class="p-3 ">
                        <div class="cursor-pointer hover:text-[#1c4c74] hover:font-semibold" (click)="taskdetail(item)">
                            {{item.project}}
                        </div>
                    </td>
                    <td class="p-3">
                        <div>
                            {{item.task}}
                        </div>
                    </td>
                    <td class="p-3">
                        <div>
                            {{item.date}}
                        </div>
                    </td>
                    <td class="px-3 py-2">
                        <div class="font-semibold"
                            [ngClass]="{'text-green-600': item.status === 'Complete',  'text-yellow-500': item.status === 'Pending...'}">
                            {{item.status}}
                            <p-progressBar value="50">
                                <ng-template pTemplate="content" let-value>
                                    <span></span>
                                </ng-template>
                            </p-progressBar>
                        </div>
                    </td>
                    <td class="p-3 w-10">
                        <form>
                            <p-dropdown [options]="taskstatus" [(ngModel)]="taskstatus" optionLabel="name"
                                placeholder="Accept" (onChange)="action(i)" />
                        </form>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>



<p-dialog header="Task Detail" class="px-3" [modal]="true" [(visible)]="visible" [style]="{ width: '75rem' }">
    <div class="p-4 mt-8 flex flex-col gap-2 ">
        <div class="flex justify-between border-b-2 border-gray-300 pb-2"> <span
                class="text-xl font-semibold">{{detail.project}}</span> <span class="text-lg font-semibold"
                [ngClass]="{'text-green-600': detail.status === 'Complete',  'text-yellow-500': detail.status === 'Pending...'}">{{detail.status}}</span>
        </div>
        <span
            [ngClass]="{'text-green-600': detail.status === 'Complete',  'text-yellow-500': detail.status === 'Pending...'}"
            class="text-xl font-semibold my-2">Task: {{detail.task}}</span>
        <p class="border-4 border-[#1c4c74] p-2 rounded-lg text-clip overflow-scroll min-h-80">
            {{detail.description}}
        </p>
    </div>
</p-dialog>
