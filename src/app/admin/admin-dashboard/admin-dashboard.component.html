<div class="dashboard-container">

  <!-- HEADER -->
  <header class="dashboard-header">
    <div class="logo">My Admin</div>

    <div class="flex">
      <button class="logout-btn" (click)="logout()">
        Logout
      </button>
      <div class="align-items-center flex lg:hidden block" (click)="sidebarVisible2 = true">
        <i class="pi pi-ellipsis-v"></i>
      </div>
    </div>

  </header>

  <div class="dashboard-body">
    <!-- SIDE NAVIGATION -->
    <nav class="sidebar lg:block hidden">
      <ul>
        <li class="sidebar1" routerLink="/admin/dashboard" routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }">
          Dashboard
        </li>

        <li class="sidebar1 mt-2" routerLink="/admin/imports" routerLinkActive="active">
          Import GDs
        </li>

        <li class="sidebar1 mt-2" routerLink="/admin/exports" routerLinkActive="active">
          Export GDs
        </li>



        <!-- Parent -->
        <li class="sidebar1 mt-2 flex justify-between items-center cursor-pointer" (click)="toggleReports()">
          All Reports
          <span class="pl-3">{{ showReportsSubMenu ? '▾' : '▸' }}</span>
        </li>

        <!-- Sub Menu -->
        <ul *ngIf="showReportsSubMenu" class="ml-4 mt-2">
          <li class="sidebar1 mt-2" routerLink="/admin/NOC" routerLinkActive="active">
            NOC
          </li>
          <li class="sidebar1 mt-1" routerLink="/admin/Reports" routerLinkActive="active">
            Ledger Report
          </li>

          <li class="sidebar1 mt-1" routerLink="/admin/All-Reports" routerLinkActive="active">
            All Reports
          </li>
        </ul>
      </ul>


    </nav>
    <!-- MAIN CONTENT -->
    <main class="content-area">
      <router-outlet></router-outlet>
    </main>
  </div>


</div>


<p-sidebar [(visible)]="sidebarVisible2" position="right">
  <ul class="mobile-nav-list">

    <li class="mobile-nav-item"
        routerLink="/admin/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="sidebarVisible2 = false">
      <i class="pi pi-home"></i> Dashboard
    </li>

    <li class="mobile-nav-item"
        routerLink="/admin/imports"
        routerLinkActive="active"
        (click)="sidebarVisible2 = false">
      <i class="pi pi-file-import"></i> Import GDs
    </li>

    <li class="mobile-nav-item"
        routerLink="/admin/exports"
        routerLinkActive="active"
        (click)="sidebarVisible2 = false">
      <i class="pi pi-file-export"></i> Export GDs
    </li>

    <!-- All Reports collapsible -->
    <li class="mobile-nav-item mobile-nav-parent" (click)="toggleMobileReports()">
      <span><i class="pi pi-chart-bar"></i> All Reports</span>
      <i class="pi" [ngClass]="showMobileReportsSubMenu ? 'pi-chevron-down' : 'pi-chevron-right'"></i>
    </li>

    <ul *ngIf="showMobileReportsSubMenu" class="mobile-nav-submenu">
      <li class="mobile-nav-item mobile-nav-sub-item"
          routerLink="/admin/NOC"
          routerLinkActive="active"
          (click)="sidebarVisible2 = false">
        <i class="pi pi-file"></i> NOC
      </li>
      <li class="mobile-nav-item mobile-nav-sub-item"
          routerLink="/admin/Reports"
          routerLinkActive="active"
          (click)="sidebarVisible2 = false">
        <i class="pi pi-book"></i> Ledger Report
      </li>
      <li class="mobile-nav-item mobile-nav-sub-item"
          routerLink="/admin/All-Reports"
          routerLinkActive="active"
          (click)="sidebarVisible2 = false">
        <i class="pi pi-list"></i> All Reports
      </li>
    </ul>

  </ul>
</p-sidebar>
