<div class="w-full relative" [ngClass]="{'dull-bg': loading}">

<app-dashboard>
    <button type="button" (click)="visible = true"
    class="focus:outline-none w-full md:w-auto text-white bg-[#1c4c74] hover:bg-[#1c4c74] focus:ring-4 focus:bg-[#1c4c74] rounded-lg text-sm px-3 me-2 dark:bg-[#1c4c74] dark:hover:bg-[#1c4c74] dark:focus:bg-[#1c4c74] h-[35px]">
    View Leaves Request</button>
</app-dashboard>

<div class="data-table h-full mt-3">
    <div class="mb-3 flex justify-between">
        <div>
            <span class="text-2xl font-medium ">Leaves </span>
        </div>
        <div class="flex">
            <div class="border-[0.5px] rounded-md mx-2">
                <p-calendar [(ngModel)]="rangeDates" selectionMode="range" [readonlyInput]="true" [showIcon]="true"
                    inputId="range">
                </p-calendar>
            </div>
            <div class="mr-2">
                <p-dropdown [options]="employeeDropdown" [(ngModel)]="employeeName" optionLabel="name"
                    placeholder="Select a Employee"></p-dropdown>
            </div>
            <button type="button" (click)="search()"
                class="focus:outline-none text-white bg-[#1c4c74] rounded-lg text-sm px-3 me-2 h-[35px]">
                Search
            </button>
        </div>
    </div>
</div>
<div class="data-table border-4 border-[#1c4c74] rounded-lg p-1">

    <p-table [value]="[allData]" scrollHeight="flex" class="p-datatable-gridlines p-datatable-striped ">
        <ng-template pTemplate="header">
            <tr class=" bg-[#349ce4]">
                <th class="bg-[#1c4c74] p-3 text-white w-[250px]">
                    <span class="font-semibold text-md">Name</span>
                </th>
                <th class="bg-[#1c4c74] p-3 text-white w-[250px]">
                    <span class="font-semibold text-md">Leave type</span>
                </th>
                <th class="bg-[#1c4c74] p-3 text-white w-[250px]">
                    <span class="font-semibold text-md">Date</span>
                </th>
                <th class="bg-[#1c4c74] p-3 text-white w-[250px]">
                    <span class="font-semibold text-md">Status</span>
                </th>
                <th class="bg-[#1c4c74] p-3 text-white w-[350px]">
                    <span class="font-semibold text-md">description</span>
                </th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body">
            <tr *ngFor="let item of allData">
                
                <td class="px-3 p-2">
                    <div class="font-semibold min-w-16	">
                        {{item.name}}
                    </div>
                </td>
                <td class="px-3 p-2">
                    <div class="font-semibold min-w-16	">
                        {{item.leavetype}}
                    </div>
                </td>
                <td class="px-3 py-2">
                    <div class="font-semibold min-w-32	">
                        {{item.date}}
                    </div>
                </td>
                <td class="px-3 py-2">
                    <div class="font-semibold w-fit	" [ngClass]="{'text-green-600': item.status === 'Approved', 'text-yellow-500': item.status === 'Pending...'}" >
                        {{item.status}}
                    </div>
                </td>
                <td class="px-3 py-2">
                    <div class="bg-gray-100 p-3 rounded-lg">
                        {{item.description}}
                    </div>
                </td>
                
            </tr>
        </ng-template>
    </p-table>

    </div>
</div>




<p-dialog [modal]="true" [(visible)]="visible" [style]="{ width: '85rem' }" class="p-3">
    <div class="flex justify-between p-3 items-center">
        <span class="font-bold text-lg">Approvel Request</span>
        <button type="button"
            class="text-gray-400 bg-white border border-gray-300 focus:outline-none hover:bg-gray-100 focus:ring-4 focus:ring-gray-100  rounded-lg text-sm px-3 me-2 dark:bg-gray-800 dark:text-white dark:border-gray-600 dark:hover:bg-gray-700 dark:hover:border-gray-600 dark:focus:ring-gray-700 h-[35px]">
            <i class="pi pi-refresh"></i>
        </button>

    </div>
    <div class="p-3">

        <table class="table table-bordered w-full">
            <ng-container>
                <tr class="items-center" *ngFor="let data of allData; let i = index ">
                    <div *ngIf="data.status == 'Pending...'">
                    <td class="w-[10%]">
                        <div class="m-2 bg-red-600	 text-white p-2 text-xs rounded-md" style="width: fit-content;">
                          Apply Leaves</div>
                    </td>
                    <td class="w-full">
                        <span class="px-2 text-sm"><span class="text-red-600 font-semibold">Name:</span> {{data.name}} -  <span class="text-red-600 font-semibold">Date:</span> {{data.date}} -
                        <span class="text-red-600 font-semibold" >Leave Type:</span > {{data.leavetype}} - <span class="text-red-600 font-semibold">Status:</span>{{data.status}}  </span>
                    </td>
                    <td>
                        <div class="flex gap-2 mx-2 justify-end">
                            <button class="bg-emerald-500 text-white px-7 py-2 rounded-full" (click)="acceptleave(data)">Accept</button>
                            <button class="bg-red-500 text-white px-8 py-2 rounded-full" (click)="rejectleave(data)" >Reject</button>
                        </div>

                    </td>
                    </div>
                </tr>
            </ng-container>
        </table>

        <div class="mt-3 justify-end flex">
            <button type="button" (click)="cancelFrom()"
                class="focus:outline-none text-white bg-[#1c4c74] hover:bg-green-800 focus:ring-4 focus:ring-green-300 rounded-lg text-sm px-3 me-2 dark:bg-green-600 dark:hover:bg-green-700 dark:focus:ring-green-800 h-[35px]">
                Cancel </button>
        </div>
    </div>
</p-dialog>
