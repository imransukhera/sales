<div class="card">
    <h2>Contact Page Info</h2>

    <p-table [value]="appList" class="styled-table" [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template pTemplate="header">
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Subject</th>
                <th>Description</th>
                <th>Action</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-product>
            <tr>
                <td class="w-30rem">{{ product?.name }}</td>
                <td class="w-30rem">{{ product?.email }}</td>
                <td class="w-30rem">{{ product?.subject }}</td>
                <td class="w-30rem">{{ product?.notes }}</td>
                <td class="w-20rem">
                    <i class="pi pi-send pl-2 cursor-pointer" (click)="openEditDialog(product)"></i>
                    <i class="pi pi-trash pl-2 cursor-pointer" (click)="deleteValue(product?.id)"></i>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>

<p-dialog header="Send Message" [modal]="true" [(visible)]="visible" [style]="{ width: '30rem' }">
    <form [formGroup]="editForm" (ngSubmit)="updateAppointment()">

        <!-- Name -->
        <div class="py-2">
            <label>Sent To</label>
            <input type="text" class="w-full p-inputtext mt-2" formControlName="email">
             <div *ngIf="submitted && f['email'].errors" class="invalid-feedback" style="margin-top: -15px;">
                <div *ngIf="!f['email'].value" class="error text-red-500">
                    Field is required
                </div>
            </div>
        </div>

        <!-- Service Name -->
        <div class="py-2">
            <label>Subject</label>
            <input type="text" class="w-full p-inputtext mt-2" formControlName="subject">

             <div *ngIf="submitted && f['subject'].errors" class="invalid-feedback" style="margin-top: -15px;">
                <div *ngIf="!f['subject'].value" class="error text-red-500">
                    Field is required
                </div>
            </div>
        </div>

        <!-- Time -->
        <div class="py-2">
            <label>Description</label>
            <div class="mt-2">
                <textarea rows="4" formControlName="notes"></textarea>
            </div>

            <div *ngIf="submitted && f['notes'].errors" class="invalid-feedback" style="margin-top: -15px;">
                <div *ngIf="!f['notes'].value" class="error text-red-500">
                    Field is required
                </div>
            </div>
        </div>

        <div class="py-4 flex justify-content-end">
            <button class="button text-white border-round-lg">
                Send
            </button>
        </div>
    </form>
</p-dialog>

<p-toast></p-toast>
